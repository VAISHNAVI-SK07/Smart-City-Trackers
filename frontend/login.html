<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand navbar-brand-civic" href="index.html">
        Smart Civic Tracker
        <span class="subtitle">Citizen-Centric Issue Reporting</span>
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="card civic-card auth-card p-4">
      <div class="card-body">
        <h3 class="fw-bold mb-1">Welcome back</h3>
        <p class="text-muted mb-4">Log in to report and track civic issues.</p>

        <div id="alert-container"></div>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-civic-primary w-100" id="login-btn">Log In</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const result = await Api.login({ email, password });
        // Redirect based on role returned by the server.
        window.location.href = result.user.role === 'admin'
          ? 'admin-dashboard.html'
          : 'citizen-dashboard.html';
      } catch (err) {
        showAlert('alert-container', err.message);
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
