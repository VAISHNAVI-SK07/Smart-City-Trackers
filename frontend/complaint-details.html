<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Details — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-civic" href="citizen-dashboard.html">
        Smart Civic Tracker
        <span class="subtitle">Citizen-Centric Issue Reporting</span>
      </a>
      <a href="citizen-dashboard.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
      </a>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 800px;">
    <div id="loading-state" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>

    <div id="content" class="d-none">
      <div id="alert-container"></div>

      <div class="card civic-card mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h4 class="fw-bold mb-0" id="c-title"></h4>
            <span class="badge-status" id="c-status"></span>
          </div>
          <div class="mb-3">
            <span class="badge-priority me-2" id="c-priority"></span>
            <span class="badge bg-light text-dark border" id="c-category"></span>
          </div>
          <p id="c-description" class="mb-3"></p>
          <img id="c-image" class="img-fluid rounded mb-3 d-none" style="max-height: 320px;" alt="Complaint photo">
          <div class="row text-muted small">
            <div class="col-sm-6 mb-2"><i class="bi bi-geo-alt me-1"></i> <span id="c-address">No address given</span></div>
            <div class="col-sm-6 mb-2"><i class="bi bi-clock me-1"></i> Reported <span id="c-created"></span></div>
          </div>

          <div id="action-buttons" class="mt-3"></div>
        </div>
      </div>

      <div class="card civic-card mb-4">
        <div class="card-header bg-white fw-bold">Status Timeline</div>
        <div class="card-body">
          <div class="timeline" id="timeline"></div>
        </div>
      </div>

      <div class="card civic-card" id="feedback-card" style="display: none;">
        <div class="card-header bg-white fw-bold">Your Feedback</div>
        <div class="card-body" id="feedback-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const complaintId = new URLSearchParams(window.location.search).get('id');

    async function init() {
      const user = await requireAuth('citizen');
      if (!user) return;

      if (!complaintId) {
        document.getElementById('loading-state').innerHTML =
          '<div class="alert alert-danger">No complaint ID provided.</div>';
        return;
      }

      try {
        const { complaint, status_history, feedback } = await Api.complaintDetail(complaintId);
        render(complaint, status_history, feedback);
      } catch (err) {
        document.getElementById('loading-state').innerHTML =
          `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    function render(c, history, feedback) {
      document.getElementById('loading-state').classList.add('d-none');
      document.getElementById('content').classList.remove('d-none');

      document.getElementById('c-title').textContent = c.title;
      document.getElementById('c-status').textContent = c.status;
      document.getElementById('c-status').className = `badge-status ${statusClass(c.status)}`;
      document.getElementById('c-priority').textContent = c.priority + ' Priority';
      document.getElementById('c-priority').className = `badge-priority ${c.priority}`;
      document.getElementById('c-category').textContent = c.category;
      document.getElementById('c-description').textContent = c.description;
      document.getElementById('c-address').textContent = c.address || 'No address given';
      document.getElementById('c-created').textContent = formatDate(c.created_at);

      if (c.image_path) {
        const img = document.getElementById('c-image');
        img.src = imageUrl(c.image_path);
        img.classList.remove('d-none');
      }

      // Timeline
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = history.map(h => `
        <div class="timeline-item">
          <strong>${h.new_status}</strong>
          <div class="text-muted small">${formatDate(h.changed_at)} &middot; by ${escapeHtml(h.changed_by_name)}</div>
          ${h.remarks ? `<div class="small mt-1">${escapeHtml(h.remarks)}</div>` : ''}
        </div>
      `).join('');

      // Action buttons
      const actions = document.getElementById('action-buttons');
      let buttonsHtml = '';
      if (['Resolved', 'Closed'].includes(c.status)) {
        buttonsHtml += `<button class="btn btn-outline-danger btn-sm me-2" onclick="reopenComplaint()">
          <i class="bi bi-arrow-counterclockwise me-1"></i> This isn't actually fixed — Reopen
        </button>`;
      }
      if (c.status === 'Resolved' && !feedback) {
        buttonsHtml += `<button class="btn btn-civic-primary btn-sm" data-bs-toggle="modal" data-bs-target="#feedbackModal">
          <i class="bi bi-star me-1"></i> Leave Feedback
        </button>`;
      }
      actions.innerHTML = buttonsHtml;

      // Feedback display
      if (feedback) {
        document.getElementById('feedback-card').style.display = 'block';
        document.getElementById('feedback-body').innerHTML = `
          <div class="mb-1">${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}</div>
          <p class="mb-0 text-muted">${escapeHtml(feedback.comment || 'No comment left.')}</p>
        `;
      }
    }

    async function reopenComplaint() {
      const remarks = prompt('Briefly describe why this issue is not actually resolved:');
      if (remarks === null) return;
      try {
        await Api.reopenComplaint(complaintId, remarks || 'Issue not actually resolved.');
        showAlert('alert-container', 'Complaint reopened.', 'success');
        setTimeout(() => window.location.reload(), 1000);
      } catch (err) {
        showAlert('alert-container', err.message);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    init();
  </script>

  <!-- Feedback modal -->
  <div class="modal fade" id="feedbackModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Leave Feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="feedback-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <select class="form-select" id="fb-rating" required>
                <option value="5">★★★★★ Excellent</option>
                <option value="4">★★★★☆ Good</option>
                <option value="3">★★★☆☆ Okay</option>
                <option value="2">★★☆☆☆ Poor</option>
                <option value="1">★☆☆☆☆ Very Poor</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Comment (optional)</label>
              <textarea class="form-control" id="fb-comment" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-civic-primary">Submit Feedback</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('feedback-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rating = document.getElementById('fb-rating').value;
      const comment = document.getElementById('fb-comment').value.trim();
      try {
        await Api.submitFeedback(complaintId, rating, comment);
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
