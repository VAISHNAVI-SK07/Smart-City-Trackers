<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Complaints — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand navbar-brand-civic" href="admin-dashboard.html">
        Smart Civic Tracker
        <span class="subtitle">Admin Panel</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="admin-dashboard.html" class="btn btn-outline-primary btn-sm">Analytics</a>
        <a href="admin-map.html" class="btn btn-outline-primary btn-sm">Map View</a>
        <a href="admin-users.html" class="btn btn-outline-primary btn-sm">Users</a>
        <button class="btn btn-outline-secondary btn-sm" id="logout-btn">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <h3 class="fw-bold mb-4">All Complaints</h3>

    <!-- Filters -->
    <div class="card civic-card mb-3">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-3">
            <input type="text" class="form-control" id="filter-search" placeholder="Search title/description...">
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filter-status">
              <option value="">All Statuses</option>
              <option>Submitted</option>
              <option>Under Review</option>
              <option>Verified</option>
              <option>Rejected</option>
              <option>In Progress</option>
              <option>Resolved</option>
              <option>Closed</option>
              <option>Reopened</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filter-category">
              <option value="">All Categories</option>
              <option>Road</option><option>Waste</option><option>Drainage</option>
              <option>Water</option><option>Streetlight</option><option>Sanitation</option>
              <option>Infrastructure</option><option>Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filter-priority">
              <option value="">All Priorities</option>
              <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card civic-card">
      <div class="card-body p-0">
        <div id="loading-state" class="text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
        <div id="empty-state" class="empty-state d-none">
          <i class="bi bi-inbox"></i> No complaints match these filters.
        </div>
        <div class="table-responsive d-none" id="table-wrapper">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>ID</th><th>Title</th><th>Citizen</th><th>Category</th>
                <th>Priority</th><th>Status</th><th>Reported</th><th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Manage complaint modal -->
  <div class="modal fade" id="manageModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Manage Complaint #<span id="m-id"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="m-alert"></div>
          <div id="m-duplicate-warning"></div>
          <h5 id="m-title" class="fw-bold"></h5>
          <p id="m-description" class="text-muted"></p>
          <img id="m-image" class="img-fluid rounded mb-3 d-none" style="max-height: 260px;">

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label small">Category</label>
              <select class="form-select form-select-sm" id="m-category">
                <option>Road</option><option>Waste</option><option>Drainage</option>
                <option>Water</option><option>Streetlight</option><option>Sanitation</option>
                <option>Infrastructure</option><option>Other</option>
              </select>
              <button class="btn btn-sm btn-outline-primary mt-1 w-100" onclick="updateCategory()">Update Category</button>
            </div>
            <div class="col-md-4">
              <label class="form-label small">Priority</label>
              <select class="form-select form-select-sm" id="m-priority">
                <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
              </select>
              <button class="btn btn-sm btn-outline-primary mt-1 w-100" onclick="updatePriority()">Update Priority</button>
            </div>
            <div class="col-md-4">
              <label class="form-label small">Current Status</label>
              <div><span class="badge-status" id="m-status-badge"></span></div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small">Change Status To</label>
            <select class="form-select form-select-sm mb-2" id="m-new-status"></select>
            <textarea class="form-control form-control-sm mb-2" id="m-remarks" rows="2" placeholder="Remarks for this status change..."></textarea>
            <button class="btn btn-civic-primary btn-sm w-100" onclick="updateStatus()">Apply Status Change</button>
          </div>

          <hr>
          <h6 class="fw-bold">Status History</h6>
          <div class="timeline" id="m-timeline"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Matches backend VALID_TRANSITIONS in models/complaint_model.py
    const VALID_TRANSITIONS = {
      'Submitted': ['Under Review', 'Rejected'],
      'Under Review': ['Verified', 'Rejected'],
      'Verified': ['In Progress', 'Rejected'],
      'Rejected': [],
      'In Progress': ['Resolved'],
      'Resolved': ['Closed', 'Reopened'],
      'Closed': ['Reopened'],
      'Reopened': ['Under Review', 'In Progress'],
    };

    let currentComplaintId = null;
    const manageModal = new bootstrap.Modal(document.getElementById('manageModal'));

    async function init() {
      const user = await requireAuth('admin');
      if (!user) return;

      const urlStatus = new URLSearchParams(window.location.search).get('status');
      if (urlStatus) document.getElementById('filter-status').value = urlStatus;

      await loadComplaints();

      ['filter-search', 'filter-status', 'filter-category', 'filter-priority'].forEach(id => {
        document.getElementById(id).addEventListener('input', debounce(loadComplaints, 300));
      });
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    async function loadComplaints() {
      const filters = {};
      const search = document.getElementById('filter-search').value.trim();
      const status = document.getElementById('filter-status').value;
      const category = document.getElementById('filter-category').value;
      const priority = document.getElementById('filter-priority').value;
      if (search) filters.search = search;
      if (status) filters.status = status;
      if (category) filters.category = category;
      if (priority) filters.priority = priority;

      const loading = document.getElementById('loading-state');
      const empty = document.getElementById('empty-state');
      const tableWrapper = document.getElementById('table-wrapper');

      try {
        const { complaints } = await Api.adminComplaints(filters);
        loading.classList.add('d-none');

        if (complaints.length === 0) {
          empty.classList.remove('d-none');
          tableWrapper.classList.add('d-none');
          return;
        }
        empty.classList.add('d-none');
        tableWrapper.classList.remove('d-none');

        document.getElementById('tbody').innerHTML = complaints.map(c => `
          <tr>
            <td class="text-muted">#${c.id}</td>
            <td>${escapeHtml(c.title)}</td>
            <td>${escapeHtml(c.citizen_name)}</td>
            <td>${c.category}</td>
            <td><span class="badge-priority ${c.priority}">${c.priority}</span></td>
            <td><span class="badge-status ${statusClass(c.status)}">${c.status}</span></td>
            <td class="text-muted small">${formatDate(c.created_at)}</td>
            <td><button class="btn btn-sm btn-civic-primary" onclick="openManage(${c.id})">Manage</button></td>
          </tr>
        `).join('');
      } catch (err) {
        loading.classList.add('d-none');
        showAlert('empty-state', err.message);
      }
    }

    async function openManage(id) {
      currentComplaintId = id;
      document.getElementById('m-alert').innerHTML = '';
      document.getElementById('m-duplicate-warning').innerHTML = '<div class="text-muted small"><i class="bi bi-hourglass-split"></i> Checking for duplicates...</div>';

      try {
        const { complaint, status_history } = await Api.adminComplaintDetail(id);
        document.getElementById('m-id').textContent = id;
        document.getElementById('m-title').textContent = complaint.title;
        document.getElementById('m-description').textContent = complaint.description;
        document.getElementById('m-category').value = complaint.category;
        document.getElementById('m-priority').value = complaint.priority;
        document.getElementById('m-status-badge').textContent = complaint.status;
        document.getElementById('m-status-badge').className = `badge-status ${statusClass(complaint.status)}`;

        const img = document.getElementById('m-image');
        if (complaint.image_path) {
          img.src = imageUrl(complaint.image_path);
          img.classList.remove('d-none');
        } else {
          img.classList.add('d-none');
        }

        const nextOptions = VALID_TRANSITIONS[complaint.status] || [];
        const select = document.getElementById('m-new-status');
        select.innerHTML = nextOptions.length
          ? nextOptions.map(s => `<option value="${s}">${s}</option>`).join('')
          : '<option value="">No further transitions (terminal state)</option>';
        select.disabled = nextOptions.length === 0;

        document.getElementById('m-timeline').innerHTML = status_history.map(h => `
          <div class="timeline-item">
            <strong>${h.new_status}</strong>
            <div class="text-muted small">${formatDate(h.changed_at)} &middot; by ${escapeHtml(h.changed_by_name)}</div>
            ${h.remarks ? `<div class="small mt-1">${escapeHtml(h.remarks)}</div>` : ''}
          </div>
        `).join('');

        manageModal.show();

        // Run the duplicate check AFTER we have the complaint's own data.
        checkForDuplicates(id);
      } catch (err) {
        alert(err.message);
      }
    }

    async function checkForDuplicates(id) {
      const container = document.getElementById('m-duplicate-warning');
      try {
        const { possible_duplicates } = await Api.checkDuplicates(id);
        console.log('Duplicate check result for #' + id + ':', possible_duplicates);

        if (possible_duplicates && possible_duplicates.length > 0) {
          const list = possible_duplicates.map(d =>
            `<li>#${d.complaint_id} "${escapeHtml(d.title)}" &mdash; ${Math.round(d.similarity * 100)}% similar</li>`
          ).join('');
          container.innerHTML = `
            <div class="alert alert-warning">
              <i class="bi bi-exclamation-triangle me-1"></i>
              <strong>Possible duplicate(s) detected nearby:</strong>
              <ul class="mb-0 mt-1">${list}</ul>
            </div>`;
        } else {
          container.innerHTML = '';
        }
      } catch (err) {
        console.error('Duplicate check failed:', err);
        container.innerHTML = `<div class="alert alert-secondary small">Could not check for duplicates: ${err.message}</div>`;
      }
    }

    async function updateCategory() {
      try {
        await Api.updateCategory(currentComplaintId, document.getElementById('m-category').value);
        showAlert('m-alert', 'Category updated.', 'success');
        loadComplaints();
      } catch (err) {
        showAlert('m-alert', err.message);
      }
    }

    async function updatePriority() {
      try {
        await Api.updatePriority(currentComplaintId, document.getElementById('m-priority').value);
        showAlert('m-alert', 'Priority updated.', 'success');
        loadComplaints();
      } catch (err) {
        showAlert('m-alert', err.message);
      }
    }

    async function updateStatus() {
      const newStatus = document.getElementById('m-new-status').value;
      const remarks = document.getElementById('m-remarks').value.trim();
      if (!newStatus) return;
      try {
        await Api.updateStatus(currentComplaintId, newStatus, remarks);
        showAlert('m-alert', `Status updated to '${newStatus}'.`, 'success');
        document.getElementById('m-remarks').value = '';
        await openManage(currentComplaintId);
        loadComplaints();
      } catch (err) {
        showAlert('m-alert', err.message);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await Api.logout();
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>
