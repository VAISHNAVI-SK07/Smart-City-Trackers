<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map View — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="css/style.css" rel="stylesheet">
  <style>
    #map { height: calc(100vh - 130px); width: 100%; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand navbar-brand-civic" href="admin-dashboard.html">
        Smart Civic Tracker
        <span class="subtitle">Admin Panel</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="admin-dashboard.html" class="btn btn-outline-primary btn-sm">Analytics</a>
        <a href="admin-complaints.html" class="btn btn-outline-primary btn-sm">All Complaints</a>
        <button class="btn btn-outline-secondary btn-sm" id="logout-btn">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-3">
    <div class="row g-2">
      <div class="col-md-3">
        <select class="form-select form-select-sm" id="filter-status">
          <option value="">All Statuses</option>
          <option>Submitted</option><option>Under Review</option><option>Verified</option>
          <option>Rejected</option><option>In Progress</option><option>Resolved</option>
          <option>Closed</option><option>Reopened</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-sm" id="filter-category">
          <option value="">All Categories</option>
          <option>Road</option><option>Waste</option><option>Drainage</option>
          <option>Water</option><option>Streetlight</option><option>Sanitation</option>
          <option>Infrastructure</option><option>Other</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-sm" id="filter-priority">
          <option value="">All Priorities</option>
          <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
        </select>
      </div>
      <div class="col-md-3 text-muted small align-self-center">
        <span id="marker-count">0</span> complaints shown
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script>
    const priorityColors = { Low: '#64748b', Medium: '#f59e0b', High: '#ea580c', Critical: '#dc2626' };

    const map = L.map('map').setView([11.2762, 77.5850], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);

    async function init() {
      const user = await requireAuth('admin');
      if (!user) return;
      await loadMarkers();

      ['filter-status', 'filter-category', 'filter-priority'].forEach(id => {
        document.getElementById(id).addEventListener('change', loadMarkers);
      });
    }

    async function loadMarkers() {
      const filters = {};
      const status = document.getElementById('filter-status').value;
      const category = document.getElementById('filter-category').value;
      const priority = document.getElementById('filter-priority').value;
      if (status) filters.status = status;
      if (category) filters.category = category;
      if (priority) filters.priority = priority;

      try {
        const { complaints } = await Api.adminComplaints(filters);
        markersLayer.clearLayers();

        let count = 0;
        complaints.forEach(c => {
          if (c.latitude == null || c.longitude == null) return;
          count++;

          const color = priorityColors[c.priority] || '#64748b';
          const marker = L.circleMarker([c.latitude, c.longitude], {
            radius: 9,
            fillColor: color,
            color: '#fff',
            weight: 2,
            fillOpacity: 0.9
          });

          marker.bindPopup(`
            <strong>#${c.id} ${escapeHtml(c.title)}</strong><br>
            <span class="badge-status ${statusClass(c.status)}">${c.status}</span>
            <span class="badge-priority ${c.priority}">${c.priority}</span><br>
            <span class="text-muted small">${c.category}</span><br>
            <a href="admin-complaints.html" class="small">Manage in list view &rarr;</a>
          `);

          markersLayer.addLayer(marker);
        });

        document.getElementById('marker-count').textContent = count;
      } catch (err) {
        alert(err.message);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await Api.logout();
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>
