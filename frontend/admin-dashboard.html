<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand navbar-brand-civic" href="admin-dashboard.html">
        Smart Civic Tracker
        <span class="subtitle">Admin Panel</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="admin-complaints.html" class="btn btn-outline-primary btn-sm">All Complaints</a>
        <a href="admin-map.html" class="btn btn-outline-primary btn-sm">Map View</a>
        <span class="text-muted small ms-2" id="welcome-name"></span>
        <button class="btn btn-outline-secondary btn-sm" id="logout-btn">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <h3 class="fw-bold mb-4">Analytics Overview</h3>

    <div id="loading-state" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>

    <div id="content" class="d-none">
      <!-- Stat cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="stat-card bg-total">
            <div class="stat-number" id="stat-total">0</div>
            <div class="stat-label">Total Complaints</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card bg-pending">
            <div class="stat-number" id="stat-pending">0</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card bg-resolved">
            <div class="stat-number" id="stat-resolved">0</div>
            <div class="stat-label">Resolved</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card bg-critical">
            <div class="stat-number" id="stat-critical">0</div>
            <div class="stat-label">Critical Priority</div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-lg-4">
          <div class="card civic-card h-100">
            <div class="card-header bg-white fw-bold">By Category</div>
            <div class="card-body"><canvas id="chart-category"></canvas></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card civic-card h-100">
            <div class="card-header bg-white fw-bold">By Status</div>
            <div class="card-body"><canvas id="chart-status"></canvas></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card civic-card h-100">
            <div class="card-header bg-white fw-bold">Monthly Trend</div>
            <div class="card-body"><canvas id="chart-monthly"></canvas></div>
          </div>
        </div>
      </div>

      <div class="card civic-card">
        <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <span class="text-muted">Average resolution time:</span>
            <strong id="avg-resolution">—</strong>
          </div>
          <a href="admin-complaints.html?status=Submitted" class="btn btn-civic-primary btn-sm">
            Review New Complaints <i class="bi bi-arrow-right ms-1"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    async function init() {
      const user = await requireAuth('admin');
      if (!user) return;
      document.getElementById('welcome-name').textContent = user.name;

      try {
        const data = await Api.analytics();
        render(data);
      } catch (err) {
        document.getElementById('loading-state').innerHTML =
          `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    function render(data) {
      document.getElementById('loading-state').classList.add('d-none');
      document.getElementById('content').classList.remove('d-none');

      document.getElementById('stat-total').textContent = data.total_complaints;
      document.getElementById('stat-pending').textContent = data.pending_complaints;
      document.getElementById('stat-resolved').textContent = data.resolved_complaints;
      document.getElementById('stat-critical').textContent = data.critical_complaints;
      document.getElementById('avg-resolution').textContent =
        data.avg_resolution_hours ? `${data.avg_resolution_hours} hours` : 'Not enough data yet';

      const palette = ['#2563eb', '#f59e0b', '#16a34a', '#dc2626', '#0e7490', '#9333ea', '#65a30d', '#64748b'];

      new Chart(document.getElementById('chart-category'), {
        type: 'doughnut',
        data: {
          labels: data.by_category.map(r => r.category),
          datasets: [{ data: data.by_category.map(r => r.count), backgroundColor: palette }]
        },
        options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
      });

      new Chart(document.getElementById('chart-status'), {
        type: 'bar',
        data: {
          labels: data.by_status.map(r => r.status),
          datasets: [{ data: data.by_status.map(r => r.count), backgroundColor: '#2563eb' }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { font: { size: 9 } } } }
        }
      });

      new Chart(document.getElementById('chart-monthly'), {
        type: 'line',
        data: {
          labels: data.by_month.map(r => r.month),
          datasets: [{
            data: data.by_month.map(r => r.count),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37,99,235,0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { plugins: { legend: { display: false } } }
      });
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await Api.logout();
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>
