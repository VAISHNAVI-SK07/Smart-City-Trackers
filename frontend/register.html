<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand navbar-brand-civic" href="index.html">
        Smart Civic Tracker
        <span class="subtitle">Citizen-Centric Issue Reporting</span>
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="card civic-card auth-card p-4">
      <div class="card-body">
        <h3 class="fw-bold mb-1">Create your account</h3>
        <p class="text-muted mb-4">Register to start reporting civic issues.</p>

        <div id="alert-container"></div>

        <form id="register-form">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control" id="name" required minlength="2" maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone number</label>
            <input type="tel" class="form-control" id="phone" placeholder="Optional">
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" id="address" placeholder="Optional">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6">
            <div class="form-text">At least 6 characters.</div>
          </div>
          <button type="submit" class="btn btn-civic-primary w-100" id="register-btn">Create Account</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        password: document.getElementById('password').value,
      };

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await Api.register(payload);
        showAlert('alert-container', 'Account created! Redirecting to login...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      } catch (err) {
        showAlert('alert-container', err.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
