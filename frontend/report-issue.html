<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report an Issue — Smart Civic Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand navbar-brand-civic" href="citizen-dashboard.html">
        Smart Civic Tracker
        <span class="subtitle">Citizen-Centric Issue Reporting</span>
      </a>
      <a href="citizen-dashboard.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
      </a>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 720px;">
    <h3 class="fw-bold mb-1">Report a Civic Issue</h3>
    <p class="text-muted mb-4">Give as much detail as you can — it helps get it resolved faster.</p>

    <div id="alert-container"></div>
    <div id="duplicate-warning"></div>

    <form id="report-form" class="card civic-card p-4">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" class="form-control" id="title" required minlength="5" maxlength="150"
               placeholder="e.g. Large pothole near main road">
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" id="description" rows="4" required minlength="15"
                  placeholder="Describe what's wrong, since when, and any relevant details..."></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" id="category" required>
            <option value="">Select category...</option>
            <option value="Road">Road</option>
            <option value="Waste">Waste</option>
            <option value="Drainage">Drainage</option>
            <option value="Water">Water</option>
            <option value="Streetlight">Streetlight</option>
            <option value="Sanitation">Sanitation</option>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Severity</label>
          <select class="form-select" id="severity" required>
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Photo</label>
        <input type="file" class="form-control" id="image" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp">
        <div class="form-text">JPG, PNG, GIF, or WEBP. Max 5MB.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Location</label>
        <div class="d-flex gap-2 mb-2">
          <button type="button" class="btn btn-outline-primary btn-sm" id="use-location-btn">
            <i class="bi bi-geo-alt me-1"></i> Use Current Location
          </button>
          <span class="text-muted small align-self-center">or click on the map to pin it</span>
        </div>
        <div id="map" style="height: 280px; border-radius: 8px;"></div>
        <input type="text" class="form-control mt-2" id="address" placeholder="Address / landmark (optional)">
      </div>

      <button type="submit" class="btn btn-civic-primary w-100" id="submit-btn">Submit Complaint</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script>
    let selectedLat = null;
    let selectedLng = null;
    let marker = null;

    // Default map center — adjust to your city if you like.
    const defaultCenter = [11.2762, 77.5850];
    const map = L.map('map').setView(defaultCenter, 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function setMarker(lat, lng) {
      selectedLat = lat;
      selectedLng = lng;
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map);
      map.setView([lat, lng], 16);
    }

    map.on('click', (e) => setMarker(e.latlng.lat, e.latlng.lng));

    document.getElementById('use-location-btn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => setMarker(pos.coords.latitude, pos.coords.longitude),
        () => alert('Could not get your location. Please click on the map instead.')
      );
    });

    async function init() {
      const user = await requireAuth('citizen');
      if (!user) return;
    }
    init();

    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value.trim());
      formData.append('description', document.getElementById('description').value.trim());
      formData.append('category', document.getElementById('category').value);
      formData.append('severity', document.getElementById('severity').value);
      formData.append('address', document.getElementById('address').value.trim());
      if (selectedLat !== null) {
        formData.append('latitude', selectedLat);
        formData.append('longitude', selectedLng);
      }
      const imageFile = document.getElementById('image').files[0];
      if (imageFile) formData.append('image', imageFile);

      try {
        const result = await Api.submitComplaint(formData);

        if (result.duplicate_warning) {
          document.getElementById('duplicate-warning').innerHTML = `
            <div class="alert alert-warning">
              <i class="bi bi-exclamation-triangle me-1"></i>
              <strong>${result.duplicate_warning}</strong>
              <div class="small mt-1">Similar existing report: "${escapeHtml(result.possible_duplicates[0].title)}"</div>
            </div>`;
        }

        showAlert('alert-container',
          `Complaint submitted successfully! Recommended priority: <strong>${result.recommended_priority}</strong>. Redirecting...`,
          'success');

        setTimeout(() => {
          window.location.href = `complaint-details.html?id=${result.complaint_id}`;
        }, 1800);
      } catch (err) {
        showAlert('alert-container', err.message);
        btn.disabled = false;
        btn.textContent = 'Submit Complaint';
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
